services:
  navidrome:
    image: deluan/navidrome:0.63.2
    container_name: navidrome
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "${TS_IP}:4533:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANSCHEDULE: "@every 6h"
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
      TZ: America/Chicago
    volumes:
      - /opt/services/navidrome/data:/data
      - /mnt/nas/data/media/music:/music:ro
