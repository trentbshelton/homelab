services:

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.0
    container_name: uptime-kuma-homelab
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    volumes:
      - /opt/homelab/appdata/uptime-kuma:/app/data
    networks:
      - default
      - calendar  # check baikal/agendav directly; they only listen on loopback
    ports:
      - "${TS_IP}:8083:3001"
    extra_hosts:
      - "status.home.${DOMAIN}:${TS_IP}"
      - "jellyfin.home.${DOMAIN}:${TS_IP}"
      - "homepage.home.${DOMAIN}:${TS_IP}"
      - "vault.home.${DOMAIN}:${TS_IP}"
      - "cloud.home.${DOMAIN}:${TS_IP}"
      - "music.home.${DOMAIN}:${TS_IP}"

networks:
  calendar:
    name: calendar_default
    external: true
