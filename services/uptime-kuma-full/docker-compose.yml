services:

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.0
    container_name: uptime-kuma-homelab
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    volumes:
      - /opt/homelab/appdata/uptime-kuma:/app/data
    ports:
      - "${TS_IP}:8083:3001"
    extra_hosts:
      - "status.home.${DOMAIN}:${PROXY_TS_IP}"
      - "jellyfin.home.${DOMAIN}:${PROXY_TS_IP}"
      - "homepage.home.${DOMAIN}:${PROXY_TS_IP}"
      - "vault.home.${DOMAIN}:${PROXY_TS_IP}"
      - "cloud.home.${DOMAIN}:${PROXY_TS_IP}"
      - "music.home.${DOMAIN}:${PROXY_TS_IP}"
      - "ntfy.home.${DOMAIN}:${PROXY_TS_IP}"
